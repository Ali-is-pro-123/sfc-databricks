{% if form.non_field_errors %}<div role="alert" class="mb-5 text-red-700">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="mb-5">
  <label class="mb-2 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="mt-2 text-xs text-slate-500">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p role="alert" class="mt-2 text-sm text-red-700">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
