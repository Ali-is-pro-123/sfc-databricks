<nav aria-label="Pagination" class="mt-6 flex gap-5 text-sm">
{% if page_obj.has_previous %}<a class="underline" href="?page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="underline" href="?page={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>
